[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airqore-orm"
version = "0.1.0"
description = "Small asynchronous ORM for PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["asyncpg>=0.30,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["airqore_orm*"]

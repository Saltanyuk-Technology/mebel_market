services:
  postgres:
    image: postgres:17-alpine
    container_name: mebel-market-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mebel_market
      POSTGRES_USER: mebel
      POSTGRES_PASSWORD: mebel_local_password
    ports:
      - "5433:5432"
    volumes:
      - mebel_market_postgres:/var/lib/postgresql/data
      - ./services/user-service/sql/001_users.sql:/docker-entrypoint-initdb.d/001_users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mebel -d mebel_market"]
      interval: 5s
      timeout: 3s
      retries: 10

  editor-postgres:
    image: postgres:17-alpine
    container_name: mebel-editor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mebel_editor
      POSTGRES_USER: mebel_editor
      POSTGRES_PASSWORD: mebel_editor_local_password
    ports:
      - "5434:5432"
    volumes:
      - mebel_editor_postgres:/var/lib/postgresql/data
      - ./services/editor-service/sql/001_editor_schema.sql:/docker-entrypoint-initdb.d/001_editor_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mebel_editor -d mebel_editor"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mebel_market_postgres:
  mebel_editor_postgres:
